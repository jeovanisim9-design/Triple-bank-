<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triple Bank</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #111827;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.8;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    .currency {
      color: #6b7280;
      margin-top: 5px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      margin-top: 12px;
      cursor: pointer;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button.danger {
      background: #b91c1c;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      display: none;
    }

    .transaction {
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .transaction-title {
      font-weight: bold;
    }

    .transaction-date {
      color: #6b7280;
      font-size: 13px;
      margin-top: 4px;
    }

    .positive {
      color: #15803d;
      font-weight: bold;
    }

    .negative {
      color: #b91c1c;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Triple Bank</h1>
  <p>O teu banco digital</p>
</header>

<div class="container">

  <!-- INÍCIO -->

  <div id="home">

    <div class="card">
      <p>Saldo disponível</p>

      <div class="balance">
        €0,00
      </div>

      <div class="currency">
        EUR
      </div>
    </div>

    <div class="card">

      <h2>Bem-vindo ao Triple Bank</h2>

      <p style="margin-top:10px;">
        A tua plataforma financeira digital.
      </p>

      <button onclick="showLogin()">
        Entrar na conta
      </button>

      <button class="secondary" onclick="showRegister()">
        Criar conta
      </button>

    </div>

  </div>


  <!-- REGISTO -->

  <div id="register" class="hidden">

    <div class="card">

      <h2>Criar conta</h2>

      <input id="registerName" type="text" placeholder="Nome">

      <input id="registerEmail" type="email" placeholder="Email">

      <input id="registerPassword" type="password" placeholder="Palavra-passe">

      <input id="registerConfirm" type="password" placeholder="Confirmar palavra-passe">

      <button onclick="register()">
        Criar conta
      </button>

      <button class="secondary" onclick="showHome()">
        Voltar
      </button>

      <div id="registerMessage" class="message"></div>

    </div>

  </div>


  <!-- LOGIN -->

  <div id="login" class="hidden">

    <div class="card">

      <h2>Entrar na conta</h2>

      <input id="loginEmail" type="email" placeholder="Email">

      <input id="loginPassword" type="password" placeholder="Palavra-passe">

      <button onclick="login()">
        Entrar
      </button>

      <button class="secondary" onclick="showHome()">
        Voltar
      </button>

      <div id="loginMessage" class="message"></div>

    </div>

  </div>


  <!-- PAINEL -->

  <div id="dashboard" class="hidden">

    <div class="card">

      <h2>Olá, <span id="userName"></span> 👋</h2>

      <p style="margin-top:20px;">
        Saldo disponível
      </p>

      <div class="balance">
        €<span id="userBalance">0,00</span>
      </div>

      <div class="currency">
        EUR
      </div>

    </div>


    <!-- ADICIONAR SALDO -->

    <div class="card">

      <h2>Adicionar saldo</h2>

      <input
        id="addAmount"
        type="number"
        min="0"
        step="0.01"
        placeholder="Valor em €"
      >

      <button onclick="addBalance()">
        💰 Adicionar saldo fictício
      </button>

      <div id="addMessage" class="message"></div>

    </div>


    <!-- ENVIAR -->

    <div class="card">

      <h2>Enviar</h2>

      <input
        id="sendEmail"
        type="email"
        placeholder="Email do destinatário"
      >

      <input
        id="sendAmount"
        type="number"
        min="0"
        step="0.01"
        placeholder="Valor em €"
      >

      <button onclick="sendMoney()">
        💸 Enviar saldo
      </button>

      <div id="sendMessage" class="message"></div>

    </div>


    <!-- RECEBER -->

    <div class="card">

      <h2>Receber</h2>

      <p style="margin-top:10px;">
        O teu email para receber saldo:
      </p>

      <p
        id="receiveEmail"
        style="margin-top:10px;font-weight:bold;"
      ></p>

      <button onclick="copyReceiveEmail()">
        📥 Copiar email
      </button>

      <div id="receiveMessage" class="message"></div>

    </div>


    <!-- TRANSAÇÕES -->

    <div class="card">

      <h2>Histórico</h2>

      <div id="transactions"></div>

    </div>


    <div class="card">

      <button class="danger" onclick="logout()">
        Terminar sessão
      </button>

    </div>

  </div>

</div>


<script>

  function hideAll() {

    document.getElementById("home").classList.add("hidden");

    document.getElementById("register").classList.add("hidden");

    document.getElementById("login").classList.add("hidden");

    document.getElementById("dashboard").classList.add("hidden");

  }


  function showHome() {

    hideAll();

    document.getElementById("home").classList.remove("hidden");

  }


  function showRegister() {

    hideAll();

    document.getElementById("register").classList.remove("hidden");

  }


  function showLogin() {

    hideAll();

    document.getElementById("login").classList.remove("hidden");

  }


  function getUser() {

    const savedUser =
      localStorage.getItem("tripleBankUser");

    if (!savedUser) {
      return null;
    }

    return JSON.parse(savedUser);

  }


  function saveUser(user) {

    localStorage.setItem(
      "tripleBankUser",
      JSON.stringify(user)
    );

  }


  function register() {

    const name =
      document.getElementById("registerName").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    const confirm =
      document.getElementById("registerConfirm").value;

    const message =
      document.getElementById("registerMessage");


    if (!name || !email || !password || !confirm) {

      message.style.display = "block";

      message.textContent =
        "Preenche todos os campos.";

      return;

    }


    if (password !== confirm) {

      message.style.display = "block";

      message.textContent =
        "As palavras-passe não coincidem.";

      return;

    }


    if (password.length < 6) {

      message.style.display = "block";

      message.textContent =
        "A palavra-passe deve ter pelo menos 6 caracteres.";

      return;

    }


    const user = {

      name: name,

      email: email,

      password: password,

      balance: 0,

      transactions: []

    };


    saveUser(user);


    showDashboard(user);

  }


  function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const user = getUser();

    const message =
      document.getElementById("loginMessage");


    if (!user) {

      message.style.display = "block";

      message.textContent =
        "Ainda não existe uma conta neste dispositivo.";

      return;

    }


    if (
      email !== user.email ||
      password !== user.password
    ) {

      message.style.display = "block";

      message.textContent =
        "Email ou palavra-passe incorretos.";

      return;

    }


    showDashboard(user);

  }


  function showDashboard(user) {

    hideAll();

    document
      .getElementById("dashboard")
      .classList.remove("hidden");


    document
      .getElementById("userName")
      .textContent = user.name;


    document
      .getElementById("userBalance")
      .textContent =
      Number(user.balance)
      .toFixed(2)
      .replace(".", ",");


    document
      .getElementById("receiveEmail")
      .textContent = user.email;


    displayTransactions(user);

  }


  function addBalance() {

    const amount =
      Number(
        document.getElementById("addAmount").value
      );


    const message =
      document.getElementById("addMessage");


    if (!amount || amount <= 0) {

      message.style.display = "block";

      message.textContent =
        "Introduz um valor válido.";

      return;

    }


    const user = getUser();


    user.balance += amount;


    user.transactions.unshift({

      type: "Entrada",

      description: "Saldo fictício adicionado",

      amount: amount,

      date: new Date().toLocaleString("pt-PT")

    });


    saveUser(user);


    document.getElementById("addAmount").value = "";


    message.style.display = "block";

    message.textContent =
      "Saldo fictício adicionado com sucesso.";


    showDashboard(user);

  }


  function sendMoney() {

    const email =
      document.getElementById("sendEmail").value.trim();

    const amount =
      Number(
        document.getElementById("sendAmount").value
      );


    const message =
      document.getElementById("sendMessage");


    const user = getUser();


    if (!email || !amount || amount <= 0) {

      message.style.display = "block";

      message.textContent =
        "Preenche o email e um valor válido.";

      return;

    }


    if (amount > user.balance) {

      message.style.display = "block";

      message.textContent =
        "Saldo insuficiente.";

      return;

    }


    user.balance -= amount;


    user.transactions.unshift({

      type: "Saída",

      description:
        "Envio para " + email,

      amount: -amount,

      date: new Date().toLocaleString("pt-PT")

    });


    saveUser(user);


    document.getElementById("sendEmail").value = "";

    document.getElementById("sendAmount").value = "";


    message.style.display = "block";

    message.textContent =
      "Envio registado no protótipo.";


    showDashboard(user);

  }


  function displayTransactions(user) {

    const container =
      document.getElementById("transactions");


    container.innerHTML = "";


    if (
      !user.transactions ||
      user.transactions.length === 0
    ) {

      container.innerHTML =
        "<p style='margin-top:15px;color:#6b7280;'>Ainda não existem transações.</p>";

      return;

    }


    user.transactions.forEach(function(transaction) {

      const div =
        document.createElement("div");


      div.className = "transaction";


      const amount =
        Number(transaction.amount);


      const amountText =
        (amount >= 0 ? "+" : "") +
        "€" +
        Math.abs(amount)
          .toFixed(2)
          .replace(".", ",");


      div.innerHTML =

        "<div class='transaction-title'>" +
        transaction.description +
        "</div>" +

        "<div class='" +
        (amount >= 0 ? "positive" : "negative") +
        "'>" +
        amountText +
        "</div>" +

        "<div class='transaction-date'>" +
        transaction.date +
        "</div>";


      container.appendChild(div);

    });

  }


  function copyReceiveEmail() {

    const user = getUser();

    navigator.clipboard.writeText(user.email);


    const message =
      document.getElementById("receiveMessage");


    message.style.display = "block";

    message.textContent =
      "Email copiado.";

  }


  function logout() {

    showHome();

  }


  window.onload = function() {

    const user = getUser();


    if (user) {

      showDashboard(user);

    }

  };

</script>

</body>
</html>
