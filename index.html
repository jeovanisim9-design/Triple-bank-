<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Triple Bank</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fa;
  color:#111827;
  min-height:100vh;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:24px 20px;
}

header h1{
  font-size:30px;
}

header p{
  margin-top:6px;
  opacity:.8;
}

.container{
  max-width:500px;
  margin:auto;
  padding:25px 20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h2{
  font-size:26px;
}

p{
  line-height:1.5;
}

.balance{
  font-size:42px;
  font-weight:bold;
  margin-top:12px;
}

.currency{
  color:#6b7280;
  margin-top:5px;
}

input{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#111827;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.danger{
  background:#b91c1c;
}

.hidden{
  display:none !important;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  background:#f3f4f6;
  border-radius:10px;
}

.transaction{
  padding:15px 0;
  border-bottom:1px solid #e5e7eb;
}

.transaction:last-child{
  border-bottom:0;
}

.transaction-title{
  font-weight:bold;
}

.transaction-date{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.positive{
  color:#15803d;
  font-weight:bold;
  margin-top:4px;
}

.negative{
  color:#b91c1c;
  font-weight:bold;
  margin-top:4px;
}

</style>
</head>


<body>

<header>

<h1>Triple Bank</h1>

<p>O teu banco digital</p>

</header>


<div class="container">


<!-- HOME -->

<section id="home">

<div class="card">

<p>Saldo disponível</p>

<div class="balance">
€0,00
</div>

<div class="currency">
EUR
</div>

</div>


<div class="card">

<h2>Bem-vindo ao Triple Bank</h2>

<p style="margin-top:10px;">
A tua plataforma financeira digital.
</p>


<button id="loginButton">
Entrar na conta
</button>


<button id="registerButton" class="secondary">
Criar conta
</button>

</div>

</section>



<!-- REGISTO -->

<section id="register" class="hidden">

<div class="card">

<h2>Criar conta</h2>


<input
id="registerName"
type="text"
placeholder="Nome"
>


<input
id="registerEmail"
type="email"
placeholder="Email"
>


<input
id="registerPassword"
type="password"
placeholder="Palavra-passe"
>


<input
id="registerConfirm"
type="password"
placeholder="Confirmar palavra-passe"
>


<button id="createAccountButton">
Criar conta
</button>


<button id="backFromRegister" class="secondary">
Voltar
</button>


<div id="registerMessage" class="message"></div>

</div>

</section>



<!-- LOGIN -->

<section id="login" class="hidden">

<div class="card">

<h2>Entrar na conta</h2>


<input
id="loginEmail"
type="email"
placeholder="Email"
>


<input
id="loginPassword"
type="password"
placeholder="Palavra-passe"
>


<button id="enterButton">
Entrar
</button>


<button id="backFromLogin" class="secondary">
Voltar
</button>


<div id="loginMessage" class="message"></div>

</div>

</section>



<!-- DASHBOARD -->

<section id="dashboard" class="hidden">


<div class="card">

<h2>
Olá, <span id="userName"></span> 👋
</h2>


<p style="margin-top:20px;">
Saldo disponível
</p>


<div class="balance">
€<span id="userBalance">0,00</span>
</div>


<div class="currency">
EUR
</div>

</div>



<!-- ADICIONAR -->

<div class="card">

<h2>Adicionar saldo</h2>


<input
id="addAmount"
type="number"
min="0"
step="0.01"
placeholder="Valor em €"
>


<button id="addButton">
💰 Adicionar saldo fictício
</button>


<div id="addMessage" class="message"></div>

</div>



<!-- ENVIAR -->

<div class="card">

<h2>Enviar</h2>


<input
id="sendEmail"
type="email"
placeholder="Email do destinatário"
>


<input
id="sendAmount"
type="number"
min="0"
step="0.01"
placeholder="Valor em €"
>


<button id="sendButton">
💸 Enviar saldo
</button>


<div id="sendMessage" class="message"></div>

</div>



<!-- RECEBER -->

<div class="card">

<h2>Receber</h2>


<p style="margin-top:10px;">
O teu email:
</p>


<p
id="receiveEmail"
style="font-weight:bold;margin-top:8px;"
></p>


<button id="copyButton">
📥 Copiar email
</button>


<div id="receiveMessage" class="message"></div>

</div>



<!-- HISTÓRICO -->

<div class="card">

<h2>Histórico</h2>


<div id="transactions"></div>

</div>



<!-- LOGOUT -->

<div class="card">

<button id="logoutButton" class="danger">
Terminar sessão
</button>

</div>


</section>

</div>



<script>

/* =====================================
   SISTEMA DE NAVEGAÇÃO
===================================== */

const home =
document.getElementById("home");

const register =
document.getElementById("register");

const login =
document.getElementById("login");

const dashboard =
document.getElementById("dashboard");


function showPage(page){

home.classList.add("hidden");

register.classList.add("hidden");

login.classList.add("hidden");

dashboard.classList.add("hidden");

page.classList.remove("hidden");

}


/* =====================================
   BOTÕES DE NAVEGAÇÃO
===================================== */

document
.getElementById("loginButton")
.addEventListener("click",function(){

showPage(login);

});


document
.getElementById("registerButton")
.addEventListener("click",function(){

showPage(register);

});


document
.getElementById("backFromRegister")
.addEventListener("click",function(){

showPage(home);

});


document
.getElementById("backFromLogin")
.addEventListener("click",function(){

showPage(home);

});


/* =====================================
   UTILIZADOR
===================================== */

function getUser(){

const saved =
localStorage.getItem("tripleBankUser");

if(!saved){

return null;

}

try{

const user =
JSON.parse(saved);


if(typeof user.balance !== "number"){

user.balance =
Number(user.balance) || 0;

}


if(!Array.isArray(user.transactions)){

user.transactions = [];

}


return user;

}catch(error){

console.log(error);

localStorage.removeItem("tripleBankUser");

return null;

}

}


function saveUser(user){

localStorage.setItem(
"tripleBankUser",
JSON.stringify(user)
);

}


/* =====================================
   REGISTAR CONTA
===================================== */

document
.getElementById("createAccountButton")
.addEventListener("click",function(){

const name =
document
.getElementById("registerName")
.value
.trim();


const email =
document
.getElementById("registerEmail")
.value
.trim();


const password =
document
.getElementById("registerPassword")
.value;


const confirm =
document
.getElementById("registerConfirm")
.value;


const message =
document
.getElementById("registerMessage");


if(!name ||
!email ||
!password ||
!confirm){

message.style.display="block";

message.textContent=
"Preenche todos os campos.";

return;

}


if(password !== confirm){

message.style.display="block";

message.textContent=
"As palavras-passe não coincidem.";

return;

}


if(password.length < 6){

message.style.display="block";

message.textContent=
"A palavra-passe deve ter pelo menos 6 caracteres.";

return;

}


const user={

name:name,

email:email,

password:password,

balance:0,

transactions:[]

};


saveUser(user);

showDashboard(user);

});


/* =====================================
   LOGIN
===================================== */

document
.getElementById("enterButton")
.addEventListener("click",function(){

const email =
document
.getElementById("loginEmail")
.value
.trim();


const password =
document
.getElementById("loginPassword")
.value;


const message =
document
.getElementById("loginMessage");


const user =
getUser();


if(!user){

message.style.display="block";

message.textContent=
"Nenhuma conta encontrada neste dispositivo.";

return;

}


if(
email !== user.email ||
password !== user.password
){

message.style.display="block";

message.textContent=
"Email ou palavra-passe incorretos.";

return;

}


showDashboard(user);

});


/* =====================================
   MOSTRAR DASHBOARD
===================================== */

function showDashboard(user){

showPage(dashboard);


document
.getElementById("userName")
.textContent=user.name;


document
.getElementById("userBalance")
.textContent=
Number(user.balance)
.toFixed(2)
.replace(".",",");


document
.getElementById("receiveEmail")
.textContent=user.email;


displayTransactions(user);

}


/* =====================================
   ADICIONAR SALDO
===================================== */

document
.getElementById("addButton")
.addEventListener("click",function(){

const input =
document
.getElementById("addAmount");


const amount =
Number(input.value);


const message =
document
.getElementById("addMessage");


if(!Number.isFinite(amount) ||
amount <= 0){

message.style.display="block";

message.textContent=
"Introduz um valor válido.";

return;

}


const user =
getUser();


if(!user){

message.style.display="block";

message.textContent=
"Não foi possível encontrar a conta.";

return;

}


user.balance =
Number(user.balance) + amount;


user.transactions.unshift({

type:"Entrada",

description:
"Saldo fictício adicionado",

amount:amount,

date:
new Date().toLocaleString("pt-PT")

});


saveUser(user);


input.value="";


showDashboard(user);


const updated =
document
.getElementById("addMessage");


updated.style.display="block";

updated.textContent=
"✅ Saldo adicionado com sucesso.";

});


/* =====================================
   ENVIAR
===================================== */

document
.getElementById("sendButton")
.addEventListener("click",function(){

const email =
document
.getElementById("sendEmail")
.value
.trim();


const amount =
Number(
document
.getElementById("sendAmount")
.value
);


const message =
document
.getElementById("sendMessage");


const user =
getUser();


if(!user){

message.style.display="block";

message.textContent=
"Conta não encontrada.";

return;

}


if(!email ||
!Number.isFinite(amount) ||
amount <= 0){

message.style.display="block";

message.textContent=
"Preenche o email e o valor.";

return;

}


if(amount > user.balance){

message.style.display="block";

message.textContent=
"Saldo insuficiente.";

return;

}


user.balance -= amount;


user.transactions.unshift({

type:"Saída",

description:
"Envio para " + email,

amount:-amount,

date:
new Date().toLocaleString("pt-PT")

});


saveUser(user);


document
.getElementById("sendEmail")
.value="";


document
.getElementById("sendAmount")
.value="";


showDashboard(user);


const updated =
document
.getElementById("sendMessage");


updated.style.display="block";

updated.textContent=
"✅ Envio registado.";

});


/* =====================================
   HISTÓRICO
===================================== */

function displayTransactions(user){

const container =
document
.getElementById("transactions");


container.innerHTML="";


if(!user.transactions ||
user.transactions.length === 0){

container.innerHTML=
"<p style='margin-top:15px;color:#6b7280;'>" +
"Nenhuma transação ainda." +
"</p>";

return;

}


user.transactions.forEach(function(transaction){

const div =
document.createElement("div");


div.className="transaction";


const amount =
Number(transaction.amount);


const amountText =
(amount >= 0 ? "+" : "-") +
"€" +
Math.abs(amount)
.toFixed(2)
.replace(".",",");


div.innerHTML=

"<div class='transaction-title'>" +
transaction.description +
"</div>" +

"<div class='" +
(amount >= 0 ? "positive" : "negative") +
"'>" +
amountText +
"</div>" +

"<div class='transaction-date'>" +
transaction.date +
"</div>";


container.appendChild(div);

});

}


/* =====================================
   COPIAR EMAIL
===================================== */

document
.getElementById("copyButton")
.addEventListener("click",function(){

const user =
getUser();


if(!user){

return;

}


if(navigator.clipboard){

navigator.clipboard
.writeText(user.email);

}


const message =
document
.getElementById("receiveMessage");


message.style.display="block";

message.textContent=
"✅ Email copiado.";

});


/* =====================================
   LOGOUT
===================================== */

document
.getElementById("logoutButton")
.addEventListener("click",function(){

showPage(home);

});


/* =====================================
   AO ABRIR
===================================== */

window.addEventListener("load",function(){

const user =
getUser();


if(user){

showDashboard(user);

}else{

showPage(home);

}

});

</script>

</body>
</html>
