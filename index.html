<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triple Bank</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    .currency {
      color: #6b7280;
      margin-top: 5px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <header>
    <h1>Triple Bank</h1>
    <p>O teu banco digital</p>
  </header>

  <div class="container">

    <div class="card">
      <p>Saldo disponível</p>
      <div class="balance">€0,00</div>
      <div class="currency">EUR</div>
    </div>

    <div class="card">
      <h2>Bem-vindo ao Triple Bank</h2>
      <p style="margin-top: 10px;">
        A tua plataforma financeira digital.
      </p>

      <button>Entrar na conta</button>
      <button>Criar conta</button>
    </div>

  </div>

</body>
</html>
